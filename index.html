<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>JRC Praise & Worship</title>

<!-- Installable app support -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#102d17" />
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png" />
<link rel="icon" href="icons/favicon-16.png" sizes="16x16" type="image/png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="JRC Chords" />
<meta name="mobile-web-app-capable" content="yes" />

<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ============================ LIBRARY VIEW ============================ -->
  <div id="view-library" class="view">
    <header class="topbar">
      <div class="brand-wrap brand-wrap-with-logo">
  <img src="icons/icon-192.png" alt="" class="brand-logo" />
  <div>
    <h1 class="brand">JRC Praise & Worship</h1>
    <div class="brand-subtitle">Music Ministry Chords</div>
  </div>
</div>
      <button id="theme-toggle-lib" class="icon-btn" aria-label="Toggle dark mode">
        <svg class="icon icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon icon-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </header>

    <div class="search-wrap">
      <input id="search-input" type="search" placeholder="Search songs…" autocomplete="off" />
    </div>

    <div id="install-banner" class="install-banner" hidden>
      <div class="install-banner-text">
        <strong>Install this app</strong>
        <span id="install-banner-sub">Get quick access from your home screen, works offline too.</span>
      </div>
      <button id="install-banner-btn" class="btn btn-primary btn-small">Install</button>
      <button id="install-banner-dismiss" class="icon-btn" aria-label="Dismiss">✕</button>
    </div>

    <nav class="tabs">
      <button class="tab active" data-tab="all">All Songs</button>
      <button class="tab" data-tab="favorites">Favorites</button>
      <button class="tab" data-tab="set">Line-up<span id="set-count" class="badge"></span></button>
    </nav>

    <div id="category-filter" class="category-filter">
      <button class="category-chip active" data-category="">All</button>
      <button class="category-chip" data-category="Entrance">Entrance</button>
      <button class="category-chip" data-category="Offertory">Offertory</button>
      <button class="category-chip" data-category="Communion">Communion</button>
      <button class="category-chip" data-category="Finale">Finale</button>
    </div>

    <div id="song-list" class="song-list"></div>

    <div id="set-builder" class="set-builder" hidden>
      <div class="set-header">
        <div>
          <p class="eyebrow">SERVICE ORDER</p>
          <h2 class="set-title">Line-up</h2>
          <p class="hint">Add songs from <strong>All Songs</strong>, then reorder them for your service.</p>
        </div>
        <span id="set-summary" class="set-summary">0 songs</span>
      </div>
      <ol id="set-list" class="set-list"></ol>
      <div class="set-actions">
        <button id="clear-set-btn" class="btn btn-ghost">Clear Set</button>
        <button id="start-set-btn" class="btn btn-primary">Start Line-up</button>
      </div>
    </div>
  </div>

  <!-- ============================= SONG VIEW =============================== -->
  <div id="view-song" class="view" hidden>
    <header class="topbar song-topbar">
      <button id="back-btn" class="icon-btn" aria-label="Back to library">
        <svg class="icon" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="song-title-wrap">
        <h1 id="song-title" class="song-title"></h1>
        <p id="song-subtitle" class="song-subtitle"></p>
      </div>
      <button id="fav-btn" class="icon-btn" aria-label="Toggle favorite">
        <svg class="icon icon-star" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 21 12 17.77 5.82 21 7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
      </button>
    </header>

    <div class="song-toolbar">
      <div class="transpose-control">
        <button id="transpose-down" class="btn btn-round" aria-label="Transpose down">−</button>
        <div class="key-display">
          <span class="key-label">Key</span>
          <span id="current-key">—</span>
        </div>
        <button id="transpose-up" class="btn btn-round" aria-label="Transpose up">+</button>
      </div>
      <div class="text-size-control">
        <button id="text-smaller" class="btn btn-round" aria-label="Smaller text">A−</button>
        <button id="text-bigger" class="btn btn-round" aria-label="Bigger text">A+</button>
      </div>
      <button id="add-to-set-btn" class="btn btn-ghost btn-small">+ Set</button>
    </div>

    <div id="song-body" class="song-body"></div>

    <div id="song-note" class="song-note"></div>

    <nav class="song-nav">
      <button id="prev-btn" class="btn btn-ghost">‹ Previous</button>
      <button id="library-btn" class="btn btn-ghost">Library</button>
      <button id="next-btn" class="btn btn-ghost">Next ›</button>
    </nav>
  </div>

  <!-- ============================ LINE-UP PLAYER ============================= -->
  <div id="view-setplay" class="view" hidden>
    <header class="topbar song-topbar">
      <button id="setplay-back-btn" class="icon-btn" aria-label="Exit line-up">
        <svg class="icon" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="song-title-wrap">
        <h1 id="setplay-title" class="song-title"></h1>
        <p id="setplay-progress" class="song-subtitle"></p>
      </div>
      <div style="width:44px"></div>
    </header>

    <div class="song-toolbar">
      <div class="transpose-control">
        <button id="setplay-transpose-down" class="btn btn-round" aria-label="Transpose down">−</button>
        <div class="key-display">
          <span class="key-label">Key</span>
          <span id="setplay-current-key">—</span>
        </div>
        <button id="setplay-transpose-up" class="btn btn-round" aria-label="Transpose up">+</button>
      </div>
    </div>

    <div id="setplay-body" class="song-body"></div>
    <div id="setplay-note" class="song-note"></div>

    <nav class="song-nav">
      <button id="setplay-prev-btn" class="btn btn-ghost">‹ Previous</button>
      <button id="setplay-exit-btn" class="btn btn-ghost">End Line-up</button>
      <button id="setplay-next-btn" class="btn btn-ghost">Next ›</button>
    </nav>
  </div>

<script src="data.js"></script>
<script src="app.js"></script>
<script src="main.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("service-worker.js").catch(() => {});
    });
  }
</script>
</body>
</html>
